<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Turn a photo or an idea into a real 3D print.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ShapePrompt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShapePrompt</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <!-- Rotating 3D models of the ready works -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <script>
    // No "Save image as…" / "Save model" menu on the showcase.
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  </script>
  <!-- Cloudflare Turnstile: lets only real people talk to the dragon -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script>
    // Resolves with a one-time Turnstile token. The widget lives in a small
    // box in the corner and disappears once the check is done.
    window.spHumanToken = function (siteKey) {
      return new Promise(function (resolve, reject) {
        if (!window.turnstile) return reject('turnstile not loaded');
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:9999';
        document.body.appendChild(box);
        var done = function () { setTimeout(function () { box.remove(); }, 0); };
        window.turnstile.render(box, {
          sitekey: siteKey,
          callback: function (token) { done(); resolve(token); },
          'error-callback': function () { done(); reject('turnstile error'); },
          'expired-callback': function () { done(); reject('turnstile expired'); },
        });
      });
    };
  </script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
